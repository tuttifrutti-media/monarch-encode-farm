name: encode-segment
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "Space-separated direct-download URLs of the master parts, in order"
        required: true
      sha256:
        description: "Expected sha256 of the reassembled master"
        required: true
      start:
        description: "Segment start seconds"
        required: true
      dur:
        description: "Segment duration seconds"
        required: true
      out_name:
        description: "Output segment filename"
        required: true
      scale:
        description: "Output scale WxH (default = FB 720p profile)"
        required: false
        default: "1280:720"
      crf:
        description: "libx264 CRF"
        required: false
        default: "34"
      preset:
        description: "libx264 preset"
        required: false
        default: "medium"
      maxrate:
        description: "libx264 maxrate"
        required: false
        default: "800k"
      bufsize:
        description: "libx264 bufsize"
        required: false
        default: "1600k"
      abitrate:
        description: "AAC audio bitrate"
        required: false
        default: "96k"
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch and reassemble master
        env:
          PARTS: ${{ inputs.parts }}
        run: |
          set -euo pipefail
          mkdir -p parts
          i=0
          for u in $PARTS; do
            printf -v n "%03d" $i
            curl -L --fail --retry 3 -o "parts/$n" "$u"
            i=$((i+1))
          done
          cat parts/* > master.mp4
          echo "${{ inputs.sha256 }}  master.mp4" | sha256sum -c -
          ffprobe -v error -show_entries format=duration -of csv=p=0 master.mp4
      - name: Encode segment
        env:
          SEG_START: ${{ inputs.start }}
          SEG_DUR: ${{ inputs.dur }}
          SEG_SCALE: ${{ inputs.scale }}
          SEG_CRF: ${{ inputs.crf }}
          SEG_PRESET: ${{ inputs.preset }}
          SEG_MAXRATE: ${{ inputs.maxrate }}
          SEG_BUFSIZE: ${{ inputs.bufsize }}
          SEG_ABITRATE: ${{ inputs.abitrate }}
          SEG_OUT: ${{ inputs.out_name }}
        run: |
          set -euo pipefail
          ffmpeg -y -v error -ss "$SEG_START" -i master.mp4 -t "$SEG_DUR" \
            -vf "scale=$SEG_SCALE" -c:v libx264 -preset "$SEG_PRESET" -crf "$SEG_CRF" -maxrate "$SEG_MAXRATE" -bufsize "$SEG_BUFSIZE" \
            -c:a aac -b:a "$SEG_ABITRATE" "$SEG_OUT"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$SEG_OUT"
      - name: Upload segment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.out_name }}
          path: ${{ inputs.out_name }}
          retention-days: 3
